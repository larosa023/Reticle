name: Build

on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Zig
        run: pip install ziglang

      - name: Build Reticle.exe
        run: ./build.sh

      - name: Build the frame capture test
        run: ./tests/build-tests.sh

      - name: Package
        run: |
          cp README.md LICENSE dist/
          cd dist
          zip Reticle-win-x64.zip Reticle.exe README.md LICENSE
          sha256sum Reticle.exe Reticle-win-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Reticle-win-x64
          path: |
            dist/Reticle.exe
            dist/Reticle-win-x64.zip
            dist/SHA256SUMS.txt
            dist/frametest.exe
            dist/fakegame.exe

  # Real Windows: frame capture must see a D3D11 (and D3D9) renderer's frames, and Reticle.exe must start.
  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Reticle-win-x64
          path: dist

      - name: Frame capture (ETW)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\frametest.exe -NoNewWindow -Wait -PassThru -RedirectStandardOutput out.txt
          Get-Content out.txt
          if ($p.ExitCode -ne 0) { throw "frame capture test failed ($($p.ExitCode))" }

      - name: Reticle detects a game and gets its FPS
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Reticle.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--version failed" }
          # a fake game in a Steam library folder, rendering with D3D11
          $game = "$env:RUNNER_TEMP\SteamLibrary\steamapps\common\TestGame"
          New-Item -ItemType Directory -Force $game | Out-Null
          Copy-Item dist\fakegame.exe "$game\TestGame.exe"
          Start-Process -FilePath dist\Reticle.exe -ArgumentList '--tray'
          Start-Sleep -Seconds 4
          Start-Process -FilePath "$game\TestGame.exe"
          Start-Sleep -Seconds 14
          $log = Get-Content "$env:LOCALAPPDATA\Reticle\reticle.log"
          $log
          if (-not (Get-Process Reticle -ErrorAction SilentlyContinue)) { throw "Reticle exited" }
          if (-not ($log -match 'game: .*testgame.exe')) { throw "Reticle didn't detect the game" }
          if (-not ($log -match 'frames: testgame.exe at')) { throw "Reticle detected the game but got no FPS" }
          # alt-tab away for longer than the 20 s capture timeout, then come back: FPS must return
          $np = Start-Process notepad -PassThru
          Start-Sleep -Seconds 26
          $gp = Get-Process TestGame
          $sh = New-Object -ComObject WScript.Shell
          $null = $sh.AppActivate($gp.Id)
          Start-Sleep -Seconds 6
          Stop-Process $np -ErrorAction SilentlyContinue
          $log = Get-Content "$env:LOCALAPPDATA\Reticle\reticle.log"
          "---- after alt-tab ----"
          $log
          $frames = @($log | Select-String 'frames: testgame.exe at').Count
          if ($frames -lt 2) { throw "FPS didn't come back after alt-tabbing back into the game" }
          Start-Process -FilePath dist\Reticle.exe -ArgumentList '--quit' -Wait
          Start-Sleep -Seconds 3
          if (Get-Process Reticle -ErrorAction SilentlyContinue) { throw "--quit didn't close Reticle" }

      - name: A normal (non-admin) launch hands over to the admin copy without a prompt
        shell: pwsh
        run: |
          Remove-Item "$env:LOCALAPPDATA\Reticle\reticle.log" -ErrorAction SilentlyContinue
          $sid = ([System.Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          $p = Start-Process -FilePath dist\Reticle.exe -ArgumentList "--setup-admin $sid" -Wait -PassThru
          "setup-admin exit: $($p.ExitCode)"
          schtasks /Query /TN "Reticle (larosa023)"
          if ($LASTEXITCODE -ne 0) { throw "the admin startup task wasn't created" }
          $exe = (Resolve-Path dist\Reticle.exe).Path
          runas /trustlevel:0x20000 "`"$exe`" --tray"
          Start-Sleep -Seconds 15
          $log = Get-Content "$env:LOCALAPPDATA\Reticle\reticle.log"
          $log
          Start-Process -FilePath dist\Reticle.exe -ArgumentList '--quit' -Wait
          if (-not ($log -match 'switching to the admin copy')) { throw "the normal copy didn't hand over" }
          if (-not ($log -match 'starting .*, admin\)')) { throw "the admin copy didn't start" }

  # A release is published automatically when RETICLE_VERSION in src/common.h changes on main
  # (or when a v* tag is pushed). Versions with a "-" such as 0.2.0-beta.1 are pre-releases (Beta).
  release:
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Reticle-win-x64
          path: dist

      - name: Decide release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'RETICLE_VERSION L"\K[^"]+' src/common.h)
          TAG="v$VER"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "Release $TAG already exists"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "Will publish $TAG"
          fi

      - name: Release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Reticle ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.pre }}
          body_path: CHANGELOG-latest.md
          files: |
            dist/Reticle-win-x64.zip
            dist/Reticle.exe
            dist/SHA256SUMS.txt
